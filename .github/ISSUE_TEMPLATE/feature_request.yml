name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: markdown
    attributes:
      value: Diaita is a small one-maintainer project, so requests are answered as time allows.
