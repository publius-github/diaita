name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The tag must name the versionName in app/build.gradle.kts and CHANGELOG.md must
  # describe it; that entry becomes the release notes.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tag matches app version
        id: version
        run: |
          version="$(grep -oP 'val semVer = "\K[^"]+' app/build.gradle.kts)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the changelog describes this version
        run: grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md

  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [verify, checks]
    # The signing key lives in this environment's secrets (Settings > Environments),
    # ideally behind a required reviewer, so a pushed tag alone cannot sign anything.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-disabled: true
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "RELEASE_STORE_FILE=$keystore"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } > local.properties
          ./gradlew assembleRelease --no-daemon
          rm -f "$keystore" local.properties
      - name: Verify signature and name the artifacts
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk)"
          case "$apk" in *unsigned*) echo "APK is unsigned"; exit 1;; esac
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/diaita-${VERSION}.apk"
          (cd dist && sha256sum "diaita-${VERSION}.apk" > "diaita-${VERSION}.apk.sha256")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.apk
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## [${VERSION}]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --title "Diaita v${VERSION}" --notes-file notes.md
